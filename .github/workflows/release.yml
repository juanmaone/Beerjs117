name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Check release tag
        run: node -e "const c=require('./project.config.json'); if(process.env.GITHUB_REF_NAME!=='v'+c.version) process.exit(1)"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/downloads/*.zip dist/downloads/guia-demos.docx --generate-notes
